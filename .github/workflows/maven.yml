name: Build FenixShop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compilar FenixShop
        run: mvn clean package

      - name: Subir FenixShop.jar
        uses: actions/upload-artifact@v4
        with:
          name: FenixShop
          path: target/FenixShop.jar
